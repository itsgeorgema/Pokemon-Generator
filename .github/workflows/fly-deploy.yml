name: Deploy to fly.io

on:
  push:
    branches:
      - main  # Adjust this if your default branch is named differently, like 'master'
    paths-ignore:
      - '**.md'  # Ignore changes to markdown files
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:  # Allows manual triggering of this workflow

jobs:
  deploy:
    name: Deploy to fly.io
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true  # Enable Git LFS support
          
      - name: Verify model checkpoint exists and is valid
        run: |
          echo "Checking for model checkpoint file..."
          if [ ! -f "models/checkpoint.pth" ]; then
            echo "ERROR: Model checkpoint file not found!"
            exit 1
          fi
          
          # Check file size (should be > 100MB for a real checkpoint)
          file_size=$(stat -c%s "models/checkpoint.pth" 2>/dev/null || stat -f%z "models/checkpoint.pth")
          echo "Checkpoint file size: $file_size bytes"
          
          if [ "$file_size" -lt 100000000 ]; then
            echo "ERROR: Checkpoint file too small ($file_size bytes). This indicates Git LFS failure."
            echo "File content preview:"
            head -5 "models/checkpoint.pth"
            exit 1
          fi
          
          echo "Model checkpoint verified successfully"
        
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        
      - name: Deploy to fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
        
      - name: Check deployment status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Deployment completed. Application is now available at https://original-pokemon-generator-project.fly.dev/"
          flyctl status
