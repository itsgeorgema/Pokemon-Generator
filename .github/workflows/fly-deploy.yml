name: Deploy to fly.io

on:
  push:
    branches:
      - main  # Adjust this if your default branch is named differently, like 'master'
    paths-ignore:
      - '**.md'  # Ignore changes to markdown files
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:  # Allows manual triggering of this workflow

jobs:
  deploy:
    name: Deploy to fly.io
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        
      - name: Deploy to fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
        
      - name: Check deployment status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Deployment completed. Application is now available at https://original-pokemon-generator-project.fly.dev/"
          flyctl status
